
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient Mapper</title>
<style>
body{margin:0;padding:18px;background:#10141c;color:#edf3ff;
font:16px system-ui;max-width:850px;margin:auto}
h1,h2{margin-bottom:8px}
.card{background:#1a2230;border:1px solid #334156;
border-radius:15px;padding:15px;margin:14px 0}
button,input{padding:10px;border-radius:9px;border:1px solid #42516a;
background:#273449;color:white;font:inherit;margin:3px}
button{cursor:pointer}button:disabled{opacity:.4}
.stats{display:flex;gap:10px}.stat{flex:1;background:#111923;
padding:12px;border-radius:10px;min-width:0}
.stat strong{display:block;font-size:1.5em}
small,.muted{color:#a8b5c9}
#map{width:100%;background:#111923;border-radius:10px}
.place{padding:12px 0;border-bottom:1px solid #334156}
</style>
</head>
<body>
<h1>Ambient Mapper</h1>
<p class="muted">A map of familiar radio environments. No phone location used.</p>

<section class="card">
<button id="connect">Connect Bluetooth</button>
<button id="disconnect" disabled>Disconnect</button>
<p id="connection">Disconnected</p>
<p class="muted" id="hint">Connect to your AmbientMapper device.</p>
</section>

<section class="card">
<div class="stats">
 <div class="stat">Samples<strong id="samples">—</strong></div>
 <div class="stat">Places<strong id="count">—</strong></div>
 <div class="stat">Current<strong id="current">—</strong></div>
</div>
<br>
<button id="refresh" disabled>Refresh map</button>
<button id="predict" disabled>Predict next place</button>
<button id="pause" disabled>Pause</button>
<button id="resume" disabled>Resume</button>
<p id="prediction"></p>
</section>

<section class="card">
<h2>Place graph</h2>
<p class="muted">Connections show observed transitions, not physical roads.</p>
<svg id="map" viewBox="0 0 600 380">
<text x="300" y="190" fill="#a8b5c9" text-anchor="middle">
Connect to load your map
</text>
</svg>
</section>

<section class="card">
<h2>Learned places</h2>
<div id="places">No data loaded.</div>
<button id="rename" disabled>Rename selected place</button>
<button id="reset" disabled>Erase all learned data</button>
</section>

<script>
(() => {
const S="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $=id=>document.getElementById(id);
let device,rx,tx,buffer="",data=null,selected=0;

function connected(on){
 $("connection").textContent=on?"Connected":"Disconnected";
 $("connect").disabled=on;
 $("disconnect").disabled=!on;
 ["refresh","predict","pause","resume","rename","reset"]
 .forEach(id=>$(id).disabled=!on);
}
async function send(s){
 if(!rx)throw Error("Not connected");
 await rx.writeValue(new TextEncoder().encode(s));
}
function receive(e){
 buffer+=new TextDecoder().decode(e.target.value);
 let i;
 while((i=buffer.indexOf("\n"))>=0){
  let line=buffer.slice(0,i).trim();buffer=buffer.slice(i+1);
  if(!line)continue;
  try{message(JSON.parse(line))}catch(err){console.warn(err,line)}
 }
}
function message(m){
 if(m.type==="status"){
  $("samples").textContent=m.samples;
  $("count").textContent=m.places;
  $("current").textContent=m.current<0?"Unknown":m.current+1;
 }else if(m.type==="map"){
  data=m;
  $("samples").textContent=m.samples;
  $("count").textContent=m.places.length;
  $("current").textContent=m.current<0?"Unknown":m.current+1;
  draw(m);list(m);
 }else if(m.type==="prediction"){
  $("prediction").textContent=m.to===undefined?m.message:
   `Most frequent next place: ${m.label} (${m.confidencePercent}% of recorded transitions from the current place).`;
 }else if(m.type==="ack"){
  $("hint").textContent=m.message;
 }
}
function svgEl(tag,attrs,text){
 const n=document.createElementNS("http://www.w3.org/2000/svg",tag);
 Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));
 if(text!==undefined)n.textContent=text;
 return n;
}
function draw(m){
 const svg=$("map");svg.replaceChildren();
 const ps=m.places||[],es=m.edges||[];
 if(!ps.length){
  svg.append(svgEl("text",{x:300,y:190,fill:"#a8b5c9",
  "text-anchor":"middle"},"No places learned yet"));
  return;
 }
 const pos={},r=Math.min(130,30+ps.length*8);
 ps.forEach((p,i)=>{
  const a=-Math.PI/2+i*2*Math.PI/ps.length;
  pos[p.id]={x:300+r*Math.cos(a),y:175+r*Math.sin(a)};
 });
 es.forEach(e=>{
  if(!pos[e.from]||!pos[e.to])return;
  svg.append(svgEl("line",{x1:pos[e.from].x,y1:pos[e.from].y,
   x2:pos[e.to].x,y2:pos[e.to].y,stroke:"#729dd7",
   "stroke-width":Math.min(6,1+e.count)}));
 });
 ps.forEach(p=>{
  const q=pos[p.id],active=p.id===m.current;
  svg.append(svgEl("circle",{cx:q.x,cy:q.y,r:22,
   fill:active?"#287d5b":"#294b75",
   stroke:active?"#7de0b1":"#8eb5e8","stroke-width":2}));
  svg.append(svgEl("text",{x:q.x,y:q.y+4,fill:"white",
   "font-size":13,"text-anchor":"middle"},String(p.id+1)));
  svg.append(svgEl("text",{x:q.x,y:q.y+36,fill:"#edf3ff",
   "font-size":11,"text-anchor":"middle"},p.label));
 });
}
function list(m){
 const root=$("places");root.replaceChildren();
 m.places.forEach(p=>{
  const row=document.createElement("div");row.className="place";
  const name=document.createElement("strong");
  name.textContent=`${p.id+1}. ${p.label}`;
  const info=document.createElement("p");
  info.textContent=`${p.visits} visits · last sample ${p.last}`;
  const b=document.createElement("button");b.textContent="Select";
  b.onclick=()=>{selected=p.id;$("hint").textContent="Selected "+p.label};
  row.append(name,info,b);root.append(row);
 });
}
$("connect").onclick=async()=>{
 try{
  if(!navigator.bluetooth)throw Error("This browser does not support Web Bluetooth.");
  device=await navigator.bluetooth.requestDevice({filters:[{services:[S]}]});
  device.addEventListener("gattserverdisconnected",()=>connected(false));
  const server=await device.gatt.connect();
  const service=await server.getPrimaryService(S);
  rx=await service.getCharacteristic(RX);
  tx=await service.getCharacteristic(TX);
  await tx.startNotifications();tx.addEventListener("characteristicvaluechanged",receive);
  connected(true);$("hint").textContent="Connected. The ESP32 learns even when disconnected.";
  await send("STATUS");await send("MAP");
 }catch(e){$("hint").textContent=e.message}
};
$("disconnect").onclick=()=>{if(device?.gatt.connected)device.gatt.disconnect()};
$("refresh").onclick=async()=>{await send("STATUS");await send("MAP")};
$("predict").onclick=()=>send("PREDICT");
$("pause").onclick=()=>send("PAUSE");
$("resume").onclick=()=>send("RESUME");
$("rename").onclick=async()=>{
 if(!data)return;
 const p=data.places.find(x=>x.id===selected);if(!p)return;
 const name=prompt("New label (10 characters max):",p.label);
 if(name===null)return;
 const clean=name.replace(/[^a-zA-Z0-9_-]/g,"").slice(0,10);
 if(clean)await send(`LABEL ${p.id} ${clean}`);
};
$("reset").onclick=async()=>{
 if(confirm("Permanently erase the map and route history?"))await send("RESET");
};
})();
</script>
</body>
</html>
